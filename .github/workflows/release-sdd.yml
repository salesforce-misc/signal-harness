name: Release SDD

on:
  push:
    tags:
      - "sdd-v*"

permissions:
  contents: read

jobs:
  identity:
    name: Validate SDD release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version-matched SDD tag on main
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"sdd-v{version}":
              raise SystemExit(f"SDD release tag {tag!r} does not match package version {version!r}")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  quality:
    name: SDD release quality
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src/signal_harness
      - run: python scripts/validate_assets.py
      - run: python scripts/install.py --runtime both --dry-run
      - run: python -m build

  tests:
    name: SDD release tests / Python ${{ matrix.python-version }}
    needs: identity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  publish:
    name: Publish immutable SDD release
    needs: [identity, quality, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - name: Build and checksum SDD artifacts
        run: |
          python -m build
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Signal Harness SDD ${{ needs.identity.outputs.version }}"
