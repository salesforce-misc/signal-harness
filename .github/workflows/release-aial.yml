name: Release AIAL

on:
  push:
    tags:
      - "aial-v*"

permissions:
  contents: read

jobs:
  identity:
    name: Validate AIAL release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version-matched AIAL tag on main
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib

          manifest = pathlib.Path(
              "src/signal_harness/capabilities/aial/engine/manifest.json"
          )
          if not manifest.is_file():
              raise SystemExit("AIAL engine is not present in this release checkout")
          version = json.loads(manifest.read_text())["engine"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"aial-v{version}":
              raise SystemExit(f"AIAL release tag {tag!r} does not match engine version {version!r}")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  quality:
    name: AIAL release quality
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/signal_harness/capabilities/aial/engine/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: npm ci --prefix src/signal_harness/capabilities/aial/engine
      - name: Build deterministic AIAL archive twice
        run: |
          mkdir -p dist
          python -m signal_harness.capabilities.aial.tools.build_release \
            --output dist/aial-engine-${{ needs.identity.outputs.version }}.tar.gz
          cp dist/aial-engine-${{ needs.identity.outputs.version }}.tar.gz /tmp/aial-first.tar.gz
          python -m signal_harness.capabilities.aial.tools.build_release \
            --output dist/aial-engine-${{ needs.identity.outputs.version }}.tar.gz
          cmp /tmp/aial-first.tar.gz dist/aial-engine-${{ needs.identity.outputs.version }}.tar.gz

  tests:
    name: AIAL release tests / Python ${{ matrix.python-version }}
    needs: identity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/signal_harness/capabilities/aial/engine/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: npm ci --prefix src/signal_harness/capabilities/aial/engine
      - run: python -m unittest discover -s tests/aial -v

  publish:
    name: Publish immutable AIAL release
    needs: [identity, quality, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Build and checksum AIAL artifact
        run: |
          mkdir -p dist
          python -m signal_harness.capabilities.aial.tools.build_release \
            --output dist/aial-engine-${{ needs.identity.outputs.version }}.tar.gz
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${{ needs.identity.outputs.version }}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}" \
            --title "Signal Harness AIAL ${{ needs.identity.outputs.version }}"
